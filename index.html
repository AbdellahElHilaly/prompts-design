<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Design</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #f7f9ff, #eaf2ff);
    }
    main { text-align: center; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 4.5rem);
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: #60708f;
      font-size: clamp(1rem, 3vw, 1.25rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>Prompt Design</h1>
    <p>التطبيق قيد التطوير — أول نشر ناجح ✅</p>
  </main>
</body>
</html>
