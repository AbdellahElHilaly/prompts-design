<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live demo — Prompt Design</title>
  </head>
  <body>
    <script>
      // Keeps old shared demo links working; Vue owns the actual demo page.
      const designId = new URLSearchParams(location.search).get('id')
      const target = designId ? `./#/demo/${encodeURIComponent(designId)}` : './#/'
      location.replace(target)
    </script>
  </body>
</html>
